<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขายสินค้า | Smart POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Tahoma, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; font-size: 14px; }

        .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 17px; }
        .brand i { width: 34px; height: 34px; background: #2563eb; color: #fff; border-radius: 10px; display: grid; place-items: center; font-style: normal; }
        .nav { display: flex; gap: 4px; }
        .nav a { padding: 8px 14px; border-radius: 8px; color: #64748b; text-decoration: none; font-size: 14px; }
        .nav a.on { background: #eff6ff; color: #2563eb; font-weight: bold; }
        .user { display: flex; align-items: center; gap: 12px; color: #64748b; font-size: 13px; }

        .btn { border: 1px solid #cbd5e1; background: #fff; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #1e293b; }
        .btn:hover { background: #f1f5f9; }
        .btn.pri { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: bold; }
        .btn.pri:hover { background: #1d4ed8; }
        .btn:disabled { background: #94a3b8; border-color: #94a3b8; color: #fff; cursor: not-allowed; }
        .btn.full { width: 100%; padding: 13px; font-size: 16px; }

        .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .pos { display: grid; grid-template-columns: 1fr 350px; gap: 16px; align-items: start; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; }
        h2 { font-size: 15px; margin-bottom: 12px; }

        .bar { display: flex; gap: 8px; margin-bottom: 12px; }
        input { padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; min-width: 0; }
        input:focus { outline: 2px solid #2563eb; border-color: transparent; }
        .bar input { flex: 1; }
        #cam { width: 100%; max-height: 220px; border-radius: 10px; background: #000; margin-bottom: 12px; }

        .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip { border: 1px solid #cbd5e1; background: #fff; padding: 6px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
        .chip.on { background: #2563eb; color: #fff; border-color: #2563eb; }

        .pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
        .pi { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; cursor: pointer; text-align: left; color: #1e293b; }
        .pi:hover { border-color: #2563eb; }
        .pi b { display: block; color: #2563eb; margin: 6px 0 2px; }
        .pi small { color: #64748b; }
        .pi small.low { color: #b45309; }
        .pi:disabled { opacity: .45; cursor: not-allowed; }

        .line { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #e2e8f0; gap: 8px; }
        .qty { display: flex; align-items: center; gap: 8px; }
        .qty button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
        .total { display: flex; justify-content: space-between; font-size: 22px; font-weight: bold; margin: 14px 0; }

        .methods { display: flex; gap: 8px; margin-bottom: 10px; }
        .methods .chip { flex: 1; text-align: center; border-radius: 8px; padding: 9px; }
        #received { width: 100%; }
        .quick { margin-top: 8px; }
        .change { display: flex; justify-content: space-between; padding: 11px; border-radius: 8px; font-weight: bold; margin: 10px 0; background: #dcfce7; color: #15803d; }
        .change.bad { background: #fee2e2; color: #b91c1c; }
        .done { background: #dcfce7; color: #15803d; padding: 11px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
        .empty { color: #94a3b8; text-align: center; padding: 20px 0; }
        .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 9; }

        @media (max-width: 820px) { .pos { grid-template-columns: 1fr; } .wrap { padding: 14px; } }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand"><i>S</i>Smart POS</div>
        <div class="nav"><a href="dashboard.html">ภาพรวม</a><a href="pos.html" class="on">ขายสินค้า</a><a href="sales-history.html">ประวัติการขาย</a><a href="products.html" id="navProducts" style="display:none">สินค้า</a><a href="stock.html" id="navStock" style="display:none">สต็อก</a><a href="reports.html" id="navReports" style="display:none">รายงาน</a><a href="users.html" id="navUsers" style="display:none">ผู้ใช้งาน</a></div>
        <div class="user">
            <span id="userName">กำลังโหลด...</span>
            <button class="btn" id="logoutButton">ออกจากระบบ</button>
        </div>
    </div>

    <div class="wrap">
        <div id="message"></div>
        <div class="pos">
            <div>
                <video id="cam" hidden playsinline></video>
                <div class="bar">
                    <input id="search" placeholder="ค้นหาชื่อ หรือสแกนบาร์โค้ดแล้วกด Enter" autofocus>
                    <button class="btn pri" id="scanBtn">📷 สแกน</button>
                </div>
                <div class="chips" id="chips"></div>
                <div class="pg" id="grid"><div class="empty">กำลังโหลดสินค้า...</div></div>
            </div>

            <div class="card">
                <h2 id="cartTitle">ตะกร้า</h2>
                <div id="done"></div>
                <div id="items"></div>
                <div class="total"><span>รวมทั้งสิ้น</span><span id="total">฿0</span></div>

                <div class="methods">
                    <button class="chip on" data-m="cash">เงินสด</button>
                    <button class="chip" data-m="transfer">โอนเงิน</button>
                </div>
                <div id="cashBox">
                    <input id="received" type="number" inputmode="decimal" min="0" placeholder="รับเงินมา (บาท)">
                    <div class="chips quick" id="quick"></div>
                </div>
                <div id="change"></div>

                <button class="btn pri full" id="payBtn" disabled>ชำระเงิน</button>
                <button class="btn full" id="clearBtn" style="margin-top:8px;padding:10px;font-size:14px">ล้างตะกร้า</button>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const $ = id => document.getElementById(id);
        const baht = n => "฿" + Number(n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 });
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t.h); t.h = setTimeout(() => t.style.display = "none", 3500); }

        let products = [], categories = [], cart = {}, catId = "", query = "", method = "cash";

        const total = () => Object.entries(cart).reduce((s, [id, n]) => s + Number(products.find(p => p.id === id).selling_price) * n, 0);
        const received = () => method === "cash" ? Number($("received").value) || 0 : total();

        // ---------- แสดงผล ----------
        function renderChips() {
            $("chips").innerHTML = [{ id: "", name: "ทั้งหมด" }, ...categories]
                .map(c => `<button class="chip ${c.id === catId ? "on" : ""}" data-c="${c.id}">${esc(c.name)}</button>`).join("");
            $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { catId = b.dataset.c; renderChips(); renderGrid(); });
        }

        function renderGrid() {
            const q = query.toLowerCase();
            const list = products.filter(p => (!catId || p.category_id === catId) &&
                (p.name + " " + (p.barcode || "") + " " + (p.sku || "")).toLowerCase().includes(q));
            $("grid").innerHTML = list.map(p => {
                const out = Number(p.stock_quantity) <= 0, low = Number(p.stock_quantity) <= Number(p.min_stock_level);
                return `<button class="pi" data-id="${p.id}" ${out ? "disabled" : ""}>
                    <span>${esc(p.name)}</span><b>${baht(p.selling_price)}</b>
                    <small class="${low ? "low" : ""}">${out ? "หมด" : "เหลือ " + p.stock_quantity + " " + esc(p.unit || "")}</small></button>`;
            }).join("") || '<div class="empty">ไม่พบสินค้า</div>';
            $("grid").querySelectorAll(".pi").forEach(b => b.onclick = () => addToCart(b.dataset.id));
        }

        function renderCart() {
            const ids = Object.keys(cart), t = total(), got = received(), ch = got - t;
            $("cartTitle").textContent = `ตะกร้า (${ids.length} รายการ)`;
            $("items").innerHTML = ids.map(id => {
                const p = products.find(x => x.id === id);
                return `<div class="line"><div>${esc(p.name)}<br><small style="color:#64748b">${baht(p.selling_price)}</small></div>
                    <div class="qty"><button data-i="${id}" data-d="-1">−</button>${cart[id]}<button data-i="${id}" data-d="1">+</button></div>
                    <b>${baht(p.selling_price * cart[id])}</b></div>`;
            }).join("") || '<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>';
            $("items").querySelectorAll("button").forEach(b => b.onclick = () => changeQty(b.dataset.i, +b.dataset.d));
            $("total").textContent = baht(t);

            $("cashBox").style.display = method === "cash" ? "block" : "none";
            $("quick").innerHTML = [t, 100, 500, 1000].filter(v => v > 0)
                .map(v => `<button class="chip" data-v="${v}">${v === t ? "พอดี" : baht(v)}</button>`).join("");
            $("quick").querySelectorAll("button").forEach(b => b.onclick = () => { $("received").value = b.dataset.v; renderCart(); });

            $("change").innerHTML = (method === "cash" && got > 0 && t > 0)
                ? `<div class="change ${ch < 0 ? "bad" : ""}"><span>${ch < 0 ? "ยังขาดอีก" : "เงินทอน"}</span><span>${baht(Math.abs(ch))}</span></div>` : "";
            $("payBtn").disabled = !(t > 0 && got >= t);
        }

        // ---------- ตะกร้า ----------
        function addToCart(id) {
            const p = products.find(x => x.id === id); if (!p) return;
            if ((cart[id] || 0) + 1 > Number(p.stock_quantity)) return toast("สินค้าในสต็อกไม่พอ");
            cart[id] = (cart[id] || 0) + 1; $("done").innerHTML = ""; renderCart();
        }
        function changeQty(id, d) {
            const p = products.find(x => x.id === id), n = (cart[id] || 0) + d;
            if (n <= 0) delete cart[id];
            else if (n > Number(p.stock_quantity)) return toast("สินค้าในสต็อกไม่พอ");
            else cart[id] = n;
            renderCart();
        }
        function addByCode(code) {
            code = code.trim();
            const p = products.find(x => x.barcode === code || x.sku === code);
            if (!p) { toast("ไม่พบบาร์โค้ด " + code); return false; }
            addToCart(p.id); return true;
        }
        function clearCart() { cart = {}; $("received").value = ""; renderCart(); }

        // ---------- ชำระเงิน ----------
        async function pay() {
            $("payBtn").disabled = true; $("payBtn").textContent = "กำลังบันทึก...";
            const items = Object.entries(cart).map(([id, n]) => ({ product_id: id, qty: n }));
            const { data, error } = await supabaseClient.rpc("checkout_sale",
                { p_items: items, p_received: received(), p_method: method });
            $("payBtn").textContent = "ชำระเงิน";
            if (error) { toast(error.message); renderCart(); return; }
            clearCart();
            $("done").innerHTML = `<div class="done">บันทึกบิลสำเร็จ <b>${esc(data.receipt_number)}</b> ยอด ${baht(data.total)}` +
                (method === "cash" ? ` · เงินทอน <b>${baht(data.change)}</b>` : "") + `</div>`;
            await loadProducts();
        }

        // ---------- สแกนด้วยกล้อง ----------
        async function scanCamera() {
            if (!("BarcodeDetector" in window)) return toast("เบราว์เซอร์นี้ไม่รองรับสแกนด้วยกล้อง ใช้เครื่องสแกนหรือพิมพ์บาร์โค้ดแทน");
            let stream;
            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); }
            catch { return toast("เปิดกล้องไม่ได้ (ต้องใช้ HTTPS และอนุญาตกล้อง)"); }
            const v = $("cam"), det = new BarcodeDetector(); let on = true;
            const stop = () => { on = false; stream.getTracks().forEach(t => t.stop()); v.hidden = true; };
            v.srcObject = stream; v.hidden = false; v.onclick = stop; await v.play();
            while (on) {
                try { const r = await det.detect(v); if (r.length) { addByCode(r[0].rawValue); stop(); break; } } catch { }
                await new Promise(r => setTimeout(r, 300));
            }
        }

        // ---------- โหลดข้อมูล ----------
        async function loadProducts() {
            const [p, c] = await Promise.all([
                supabaseClient.from("products").select("id, category_id, sku, barcode, name, selling_price, stock_quantity, min_stock_level, unit")
                    .eq("is_active", true).order("name"),
                supabaseClient.from("categories").select("id, name").eq("is_active", true).order("name")
            ]);
            if (p.error || c.error) throw (p.error || c.error);
            products = p.data; categories = c.data;
            renderChips(); renderGrid(); renderCart();
        }

        async function init() {
            const { data: auth } = await supabaseClient.auth.getUser();
            if (!auth.user) { window.location.replace("index.html"); return; }
            const { data: me } = await supabaseClient.from("profiles").select("full_name, role, is_active")
                .eq("auth_user_id", auth.user.id).maybeSingle();
            if (!me || !me.is_active) { await supabaseClient.auth.signOut(); window.location.replace("index.html"); return; }
            const roles = { manager: "ผู้จัดการ", cashier: "พนักงานขาย" };
            $("userName").textContent = me.full_name + " · " + (roles[me.role] || me.role);
            if (me.role === "manager") $("navProducts").style.display = ""; $("navStock").style.display = ""; $("navReports").style.display = ""; $("navUsers").style.display = "";
            await loadProducts();
        }

        // ---------- events ----------
        $("search").oninput = e => { query = e.target.value; renderGrid(); };
        $("search").onkeydown = e => { if (e.key === "Enter" && query && addByCode(query)) { query = ""; e.target.value = ""; renderGrid(); } };
        $("received").oninput = renderCart;
        $("scanBtn").onclick = scanCamera;
        $("payBtn").onclick = pay;
        $("clearBtn").onclick = clearCart;
        document.querySelectorAll(".methods .chip").forEach(b => b.onclick = () => {
            method = b.dataset.m;
            document.querySelectorAll(".methods .chip").forEach(x => x.classList.toggle("on", x === b));
            renderCart();
        });
        $("logoutButton").onclick = async function () { this.disabled = true; await supabaseClient.auth.signOut(); window.location.replace("index.html"); };

        init().catch(e => { console.error(e); $("message").innerHTML = '<div class="error">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message || e) + '</div>'; });
    </script>
</body>
</html>
